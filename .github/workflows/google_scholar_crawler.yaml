name: Get Citation Data

on:
  schedule:
    - cron: '37 8 * * *'
    # Temporary trigger probe; remove after a real schedule event succeeds.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google_scholar_crawler/**'
      - '.github/workflows/google_scholar_crawler.yaml'
      - '_config.yml'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Validate citation parsing
        run: python -m unittest discover -s google_scholar_crawler -p 'test_*.py'
      - name: Fetch total citations
        env:
          GOOGLE_SCHOLAR_ID: wDJjd2IAAAAJ
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python google_scholar_crawler/main.py
      - name: Publish successful snapshot
        shell: bash
        run: |
          set -euo pipefail
          stats_dir="$RUNNER_TEMP/scholar-stats"
          if git ls-remote --exit-code --heads origin google-scholar-stats > /dev/null; then
            git fetch origin google-scholar-stats
            git worktree add --detach "$stats_dir" FETCH_HEAD
          else
            git worktree add --detach "$stats_dir" HEAD
            git -C "$stats_dir" switch --orphan google-scholar-stats
          fi
          cp google_scholar_crawler/results/*.json "$stats_dir/"
          git -C "$stats_dir" config user.name 'github-actions[bot]'
          git -C "$stats_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$stats_dir" add gs_data.json gs_data_shieldsio.json
          if git -C "$stats_dir" diff --cached --quiet; then exit 0; fi
          git -C "$stats_dir" commit -m 'Update Google Scholar citations'
          git -C "$stats_dir" push origin HEAD:google-scholar-stats
